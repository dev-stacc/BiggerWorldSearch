name: build-image
on:
    push:
        branches: [main]
    workflow_dispatch:
permissions:
    contents: read
    packages: write
jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.tag.outputs.value }}
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: tag
              run: echo "value=$(date -u +%Y%m%d%H%M%S)-${{ github.sha }}" >> $GITHUB_OUTPUT
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64
                  push: true
                  tags: ghcr.io/dev-stacc/biggerworldsearch:${{ steps.tag.outputs.value }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
